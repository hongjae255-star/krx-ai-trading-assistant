    maximum_atr_pct: 6.00
    maximum_current_gain_pct: 8.0
    min_stop_pct: 0.55
    max_stop_pct: 0.90
    actionable_score_by_regime:
      risk_on: 58.0
      mixed: 61.0
      risk_off: 65.0
  swing:
    enabled: true
    picks: 3
    history_days: 260
    # Only the strongest pre-ranked names incur 200+ bar pagination.
    deep_history_candidates: 10
    deep_history_candidates_kr: 10
    deep_history_candidates_us: 6
    minimum_stage2_checks: 5
    maximum_current_gain_pct: 12.0
    min_stop_pct: 3.0
    max_stop_pct: 7.0
    actionable_score_by_regime:
      risk_on: 64.0
      mixed: 68.0
      risk_off: 72.0

