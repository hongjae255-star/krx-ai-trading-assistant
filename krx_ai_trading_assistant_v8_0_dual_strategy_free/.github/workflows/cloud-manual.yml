name: Cloud manual job
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job
        required: true
        default: publish
        type: choice
        options: [publish, macro, institutional, refresh-kr, refresh-us, research, kr-premarket, kr-intraday, kr-close, us-premarket, us-intraday, us-close]
      full_scan:
        description: Full market rescan for intraday jobs
        required: false
        default: true
        type: boolean
concurrency:
  group: krx-ai-cloud-state
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FREE_MODE: 'true'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      EXISTING_POSITIONS_JSON: ${{ secrets.EXISTING_POSITIONS_JSON }}
      DAY_TRADE_CAPITAL_KRW: ${{ secrets.DAY_TRADE_CAPITAL_KRW }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      KIS_MAX_RETRIES: '2'
      KIS_CONNECT_TIMEOUT: '6'
      KIS_READ_TIMEOUT: '12'
      KIS_NETWORK_COOLDOWN: '180'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [[ "${{ inputs.full_scan }}" == "true" && ("${{ inputs.job }}" == "kr-intraday" || "${{ inputs.job }}" == "us-intraday") ]]; then
            timeout 660s python -m stockbot.cloud_runner "${{ inputs.job }}" --full-scan
          else
            timeout 660s python -m stockbot.cloud_runner "${{ inputs.job }}"
          fi

      - name: Telegram failure alert
        if: ${{ failure() }}
        shell: bash
        run: |
          if [[ -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${TELEGRAM_CHAT_ID:-}" ]]; then
            TEXT="🚨 Cloud manual 작업 실패\nrun #${GITHUB_RUN_NUMBER}\n${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            curl -sS --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" >/dev/null || true
          fi
