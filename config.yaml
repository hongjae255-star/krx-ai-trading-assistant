global_macro:
  enabled: true
  cache_seconds: 900
  live_cache_seconds: 600
  # FRED network robustness. GitHub-hosted runners occasionally see transient
  # read timeouts to FRED; failed series reuse the last good cloud snapshot.
  http_timeout_seconds: 25
  http_connect_timeout_seconds: 8
  max_retries: 3
  retry_backoff_seconds: 1.5
  # Official API can use moderate concurrency. Public graph fallback is deliberately
  # gentler because GitHub-hosted runners are more likely to be throttled/time out.
  max_workers_api: 4
  max_workers_graph: 2
  live_proxies:
    spy: {symbol: SPY, exchange: NYS}
    qqq: {symbol: QQQ, exchange: NAS}
    semis: {symbol: SMH, exchange: NAS}
    smallcaps: {symbol: IWM, exchange: NYS}
    long_bonds: {symbol: TLT, exchange: NAS}
    high_yield: {symbol: HYG, exchange: NYS}
    dollar: {symbol: UUP, exchange: NYS}
    gold: {symbol: GLD, exchange: NYS}
    oil: {symbol: USO, exchange: NYS}
  # FRED_API_KEY is strongly recommended for GitHub Actions. Without it, current-vintage
  # public graph CSV is used as a fallback. With a free key, the official API is primary
  # and as-of/vintage-safe historical retrieval is available.
  series: {}

