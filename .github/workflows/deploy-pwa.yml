name: Deploy mobile PWA to Supabase
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'stockbot/cloud_deploy.py'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:
concurrency:
  group: krx-ai-pwa-deploy
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FREE_MODE: 'true'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m stockbot.cloud_deploy
