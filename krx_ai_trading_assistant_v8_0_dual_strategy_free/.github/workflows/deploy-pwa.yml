name: Deploy mobile PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static PWA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          rm -rf _site
          mkdir -p _site
          cp -R web/. _site/
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = os.environ['SUPABASE_URL'].rstrip('/') + '/storage/v1/object/public/krx-ai-public'
          refresh_endpoint = os.environ['SUPABASE_URL'].rstrip('/') + '/functions/v1/manual-refresh'
          text = (
              'window.KRX_CLOUD_MODE=true;\n'
              f'window.KRX_DATA_BASE={json.dumps(base)};\n'
              f'window.KRX_REFRESH_ENDPOINT={json.dumps(refresh_endpoint)};\n'
          )
          Path('_site/runtime-config.js').write_text(text, encoding='utf-8')
          print('Runtime data base:', base)
          PY
          printf '\nBuilt files:\n'
          find _site -maxdepth 2 -type f -print | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
