name: Cloud manual job
on:
  workflow_dispatch:
    inputs:
      job:
        description: Job
        required: true
        default: publish
        type: choice
        options: [publish, macro, research, kr-premarket, kr-intraday, kr-close, us-premarket, us-intraday, us-close]
      full_scan:
        description: Full market rescan for intraday jobs
        required: false
        default: true
        type: boolean
concurrency:
  group: krx-ai-cloud-state
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FREE_MODE: 'true'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      EXISTING_POSITIONS_JSON: ${{ secrets.EXISTING_POSITIONS_JSON }}
      DAY_TRADE_CAPITAL_KRW: ${{ secrets.DAY_TRADE_CAPITAL_KRW }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [[ "${{ inputs.full_scan }}" == "true" && ("${{ inputs.job }}" == "kr-intraday" || "${{ inputs.job }}" == "us-intraday") ]]; then
            python -m stockbot.cloud_runner "${{ inputs.job }}" --full-scan
          else
            python -m stockbot.cloud_runner "${{ inputs.job }}"
          fi
